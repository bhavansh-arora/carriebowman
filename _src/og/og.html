<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/main.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--cream); background: radial-gradient(80% 90% at 85% 100%, rgba(238,106,44,.42), transparent 60%), radial-gradient(60% 70% at 0% 0%, rgba(33,58,92,.9), transparent 70%), var(--ink); }
  .og .sun { width: 470px; height: 470px; left: 680px; top: 70px; }
  .og__fig { position: absolute; left: 700px; bottom: -40px; width: 430px; filter: drop-shadow(0 30px 50px rgba(0,0,0,.5)); }
  .og__copy { position: absolute; left: 72px; top: 70px; width: 620px; }
  .og h1 { font-size: 88px; line-height: .9; font-weight: 760; letter-spacing: -.048em; font-stretch: 104%; margin: 30px 0 0; }
  .og h1 em { font-family: var(--f-serif); font-style: italic; font-weight: 400; background: var(--sunrise); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.03em; }
  .og p { font-size: 22px; color: rgba(246,240,230,.74); margin-top: 26px; max-width: 26em; line-height: 1.45; }
  .og__brand { position: absolute; left: 72px; bottom: 54px; display: flex; align-items: center; gap: 14px; }
  .og__brand svg { width: 46px; height: 46px; }
  .og__brand b { font-family: var(--f-serif); font-weight: 500; letter-spacing: .2em; font-size: 22px; }
</style></head>
<body>
  <div class="og">
    <div class="sun"></div>
    <img class="og__fig" src="../../assets/img/photos/hero-cutout.webp" alt="">
    <div class="og__copy">
      <span class="label" style="color:rgba(246,240,230,.7)"><span class="dot"></span>Master Life Coach &amp; Trained Therapist</span>
      <h1>You’re here.<br>But are you<br><em>really</em> living?</h1>
      <p>Self-Mastery™ and private coaching that blends clinical psychology, neuroscience and real action.</p>
    </div>
    <div class="og__brand">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="none" stroke="#f6f0e6" stroke-width="1.4"/><path d="M9 24a11 11 0 0 1 22 0z" fill="#f5a524"/><path d="M6 24h28M10.5 28.5h19M15 32.6h10" stroke="#f6f0e6" stroke-width="1.4" stroke-linecap="round"/></svg>
      <b>CARRIE BOWMAN</b>
    </div>
  </div>
</body></html>
