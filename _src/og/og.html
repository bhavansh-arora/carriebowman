<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/main.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--cream); background: radial-gradient(55% 70% at 88% 10%, rgba(91,75,214,.55), transparent 70%), radial-gradient(60% 70% at 78% 110%, rgba(255,126,95,.38), transparent 66%), radial-gradient(50% 60% at 0% 0%, rgba(33,58,92,.9), transparent 70%), var(--ink); }
  .og__arch { position: absolute; left: 720px; top: 70px; bottom: -2px; width: 370px; border-radius: 999px 999px 0 0; background: linear-gradient(180deg, rgba(182,164,255,.38) 0%, rgba(247,118,138,.32) 50%, rgba(255,150,110,.55) 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .og__arch--line { left: 694px; top: 44px; width: 422px; background: none; box-shadow: inset 0 0 0 1px rgba(246,240,230,.22); }
  .og__fig { position: absolute; left: 700px; bottom: -40px; width: 420px; }
  .og__copy { position: absolute; left: 72px; top: 70px; width: 620px; }
  .og h1 { font-size: 88px; line-height: .9; font-weight: 760; letter-spacing: -.048em; font-stretch: 104%; margin: 30px 0 0; }
  .og h1 em { font-family: var(--f-serif); font-style: italic; font-weight: 400; background: var(--sunrise); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.03em; }
  .og p { font-size: 22px; color: rgba(246,240,230,.74); margin-top: 26px; max-width: 26em; line-height: 1.45; }
  .og__brand { position: absolute; left: 72px; bottom: 54px; display: flex; align-items: center; gap: 14px; }
  .og__brand svg { width: 46px; height: 46px; }
  .og__brand b { font-family: var(--f-serif); font-weight: 500; letter-spacing: .2em; font-size: 22px; }
  .og__spark { position: absolute; color: var(--sun-hi); width: 22px; height: 22px; }
</style></head>
<body>
  <div class="og">
    <div class="og__arch og__arch--line"></div>
    <div class="og__arch"></div>
    <img class="og__fig" src="../../assets/img/photos/hero-cutout.webp" alt="">
    <svg class="og__spark" style="left:660px;top:150px" viewBox="0 0 40 40" fill="currentColor"><path d="M20 2c1.2 11.6 6.4 16.8 18 18-11.6 1.2-16.8 6.4-18 18-1.2-11.6-6.4-16.8-18-18C13.6 18.8 18.8 13.6 20 2z"/></svg>
    <svg class="og__spark" style="left:1120px;top:250px;width:14px;height:14px;color:#b6a4ff" viewBox="0 0 40 40" fill="currentColor"><path d="M20 2c1.2 11.6 6.4 16.8 18 18-11.6 1.2-16.8 6.4-18 18-1.2-11.6-6.4-16.8-18-18C13.6 18.8 18.8 13.6 20 2z"/></svg>
    <div class="og__copy">
      <span class="label" style="color:rgba(246,240,230,.7)"><span class="dot"></span>Master Life Coach &amp; Trained Therapist</span>
      <h1>You’re here.<br>But are you<br><em>really</em> living?</h1>
      <p>Self-Mastery™ and private coaching that blends clinical psychology, neuroscience and real action.</p>
    </div>
    <div class="og__brand">

      <b>CARRIE BOWMAN</b>
    </div>
  </div>
</body></html>
