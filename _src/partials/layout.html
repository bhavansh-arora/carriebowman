  <!-- Intro: two "eyelids". The same line sits centred on the seam in both halves,

    <div class="loader__half loader__half--top">

    </div>
    <div class="loader__half loader__half--bottom">
      <i class="loader__seam"></i>
      <div class="loader__word"><span class="loader__mask"><span class="w">Wake</span> <span class="w"><em>up.</em></span></span></div>
      <div class="loader__meta loader__meta--bottom"><span>Dallas &amp; online</span><span class="loader__count">00</span></div>
